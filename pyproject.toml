[project]
name = "docforge"
version = "0.1.0"
description = "One document engine, many PDF products"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "psycopg[binary,pool]>=3.2",
    "python-multipart>=0.0.12",
    "pypdf>=6.19.0",
    "factur-x>=6.8",
    "typst>=0.15.0",
    "playwright>=1.63.0",
    "jinja2>=3.1.6",
    "anthropic>=1.6.0",
    "croniter>=6.2.4",
    "paramiko>=5.0.0",
    "cryptography>=50.0.1",
    "pydantic[email]>=2.13.5",
    "boto3>=1.43.96",
    "sentry-sdk[fastapi]>=2.69.2",
    "prometheus-client>=0.26.0",
]

[project.scripts]
docforge = "docforge.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "aiosmtpd>=1.4.6",
    "ruff>=0.16.8",
    "pyright>=1.1.414",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.basedpyright]
venvPath = "."
venv = ".venv"
pythonVersion = "3.13"

[tool.ruff.lint.flake8-bugbear]
# FastAPI declares dependencies and form fields as default arguments.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Form", "fastapi.params.Depends"]
