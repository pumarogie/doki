[project]
name = "docforge"
version = "0.1.0"
description = "One document engine, many PDF products"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "psycopg[binary,pool]>=3.2",
    "python-multipart>=0.0.12",
    "pypdf>=6.19.0",
]

[project.scripts]
docforge = "docforge.cli:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
