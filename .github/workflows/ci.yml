name: ci

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check src tests
      - run: uv run pyright src tests

  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-superuser
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    env:
      PGHOST: localhost
      PGPASSWORD: ci-superuser
      POSTGRES_USER: postgres
      DOCFORGE_DB: docforge_test
      DOCFORGE_OWNER_PASSWORD: ci-owner
      DOCFORGE_APP_PASSWORD: ci-app
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: test
          tags: docforge:test
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Create database roles
        run: sh docker/initdb.sh
      - name: Run tests
        run: >
          docker run --rm --network host
          -e DATABASE_URL=postgresql://docforge_app:ci-app@localhost:5432/docforge_test
          -e TEST_OWNER_DATABASE_URL=postgresql://docforge_owner:ci-owner@localhost:5432/docforge_test
          docforge:test
