# Local/staging stack. Secrets come from .env (see .env.example); compose refuses to start without them.
x-app: &app
  build:
    context: .
    target: runtime
    network: host  # BuildKit's default network fails DNS on some Docker Desktop setups
  image: doki:local
  environment: &app-env
    DATABASE_URL: postgresql://doki_app:${DOKI_APP_PASSWORD:?set in .env}@db:5432/doki
    DOKI_SECRET_KEY: ${DOKI_SECRET_KEY:?set in .env}
    LLM_PROVIDER: ${LLM_PROVIDER:-mock}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    SMTP_HOST: mailpit
    SMTP_PORT: "1025"
    KOSIT_URL: http://kosit:8080
    STORAGE_BACKEND: s3
    S3_BUCKET: doki-files
    S3_ENDPOINT_URL: http://minio:9000
    AWS_ACCESS_KEY_ID: doki
    AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set in .env}
    AWS_DEFAULT_REGION: us-east-1
    SENTRY_DSN: ${SENTRY_DSN:-}
    METRICS_TOKEN: ${METRICS_TOKEN:-}
    WORKER_METRICS_PORT: "9100"
    SMTP_FROM: ${SMTP_FROM:-reports@doki.local}
  restart: unless-stopped

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env}
      DOKI_OWNER_PASSWORD: ${DOKI_OWNER_PASSWORD:?set in .env}
      DOKI_APP_PASSWORD: ${DOKI_APP_PASSWORD:?set in .env}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    command: >
      postgres
      -c shared_preload_libraries=pg_stat_statements
      -c log_min_duration_statement=250ms
      -c log_lock_waits=on
      -c log_temp_files=0
      -c track_io_timing=on
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb.sh:/docker-entrypoint-initdb.d/10-doki.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d doki"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: doki
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set in .env}
    volumes:
      - objects:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  migrate:
    <<: *app
    command: ["sh", "-c", "doki migrate --url postgresql://doki_owner:${DOKI_OWNER_PASSWORD}@db:5432/doki && doki ensure-bucket"]
    restart: "no"
    depends_on:
      db: { condition: service_healthy }
      minio: { condition: service_healthy }

  kosit:
    <<: *app
    command: ["java", "-jar", "/opt/kosit/validator.jar", "-s", "/opt/kosit/config/scenarios.xml",
              "-r", "/opt/kosit/config", "-D", "-G", "-H", "0.0.0.0", "-P", "8080"]
    environment: {}  # needs no secrets
    volumes: []
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -o /dev/null -X POST --data '<a/>' http://localhost:8080/ || [ $? -eq 22 ]"]
      interval: 5s
      retries: 30
      start_period: 20s

  api:
    <<: *app
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate: { condition: service_completed_successfully }
      kosit: { condition: service_healthy }

  worker:
    <<: *app
    command: ["python", "-m", "doki.worker"]
    healthcheck:
      disable: true
    depends_on:
      migrate: { condition: service_completed_successfully }
      kosit: { condition: service_healthy }

  mailpit:
    image: axllent/mailpit:v1.31.2
    ports:
      - "127.0.0.1:8025:8025"
    restart: unless-stopped

volumes:
  pgdata:
  objects:
